# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/ai-designer
#
# AI-maintained: the agent triages, answers, reviews, closes what has stalled and merges on green,
# for everyone and for the dependency bots. Releases are NOT automated: see `release:` below.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Keys, tokens or network calls in a content script or the page world: they live only in the service worker"
    - "Remote code or eval in the extension"
    - "Business logic in Solid components"
    - "Outside human contributors' changes to CI, release or store automation (.github/, scripts/pack-crx.sh, scripts/crx-key.ts, store/, keys/): members own that pipeline"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's ruleset and `.github/workflows/` when either changes; this list is not the ruleset.
  # Waitlist lint/typecheck are STEPS of the single `Waitlist tests` job (waitlist/package.json's
  # `test` chain), so `Waitlist lint` / `Waitlist typecheck` must never be listed here: they are
  # check names that could never report, and naming them would block every merge forever.
  required_checks:
    - "Lint"
    - "Typecheck"
    - "Test (unit + integration)"
    - "Build extension"
    - "Test (e2e)"
    - "Waitlist tests"
  auto_merge: true
  auto_merge_scope: any
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # CodeRabbit is active here; without this the native review defers forever

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  # AUTO-RELEASE IS OFF, deliberately, with no `release-due` schedule. A `v*` tag runs release.yml,
  # which publishes to the Chrome Web Store when its secrets are set, and that flow has not been
  # shown to work unattended. Add the schedule once a store release has been watched end to end.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md

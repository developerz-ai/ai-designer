# developerz.ai Designer landing — production static server (unprivileged
# nginx, :8080). Serves the Vite static bundle. IPv4 listen only: pods are
# reached on their IPv4 address and the base image does not enable IPv6.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets are immutable — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The /world scroll-world page (#161). Exact match is load-bearing: without it
    # the fallback below serves index.html for /world with a 200 (today's behaviour).
    location = /world { try_files /world.html =404; }

    # Versioned scroll-world assets — immutable for a year, so a change must bump
    # the version prefix (v1 -> v2 in world.html, which is not immutable-cached).
    location /world-assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unknown routes fall back to the page shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

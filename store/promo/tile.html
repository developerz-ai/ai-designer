<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Designer promo tile</title>
<style>
  /* Two known outputs: 440x280 (small tile, ratio ~1.57) and 1400x560 (marquee,
     ratio 2.5). Same horizontal lockup at both; sizing is fluid vw with an
     explicit breakpoint at 700px so the squarer canvas doesn't blow out.
     The name break ("Developerz.ai" / "Designer") is designed (em is block),
     never left to accidental wrapping — line widths must stay inside the
     column with ~10% headroom for wider fallback fonts (DejaVu on Linux). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f7f7f4;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .stage { display: flex; align-items: center; }
  .mark { flex: none; }
  .mark img { width: 100%; height: 100%; display: block; }
  .word { display: flex; flex-direction: column; }
  .name {
    font-weight: 800; letter-spacing: -0.03em; color: #1c1c28; line-height: 1.02;
  }
  .name em { display: block; font-style: normal; color: #6366f1; }
  .tag {
    font-weight: 600; color: #6b6b7d; letter-spacing: 0.01em;
    display: flex; align-items: center;
  }
  .tag .spark { flex: none; }

  /* Narrow canvas (the 440x280 small tile). */
  .stage { gap: 4.5vw; padding: 0 5.5vw; }
  .mark { width: 22vw; height: 22vw; }
  .word { gap: 2vw; }
  .name { font-size: 7.9vw; }
  .tag { font-size: 3.1vw; gap: 1.2vw; }
  .tag .spark { width: 2.4vw; height: 2.4vw; }

  /* Wide canvas (the 1400x560 marquee). */
  @media (min-width: 701px) {
    .stage { gap: 4vw; padding: 0 5vw; }
    .mark { width: 21.5vw; height: 21.5vw; }
    .word { gap: 2.2vw; }
    .name { font-size: 7.8vw; }
    .tag { font-size: 2.55vw; gap: 1vw; }
    .tag .spark { width: 2vw; height: 2vw; }
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- 512 source: downscales crisp at both 301px (marquee) and 97px (small tile). -->
    <div class="mark"><img id="icon" src="../icons/icon-512.png" alt="Designer icon"></div>
    <div class="word">
      <div class="name">Developerz.ai <em>Designer</em></div>
      <div class="tag">
        <!-- viewBox tight to the 32x32 glyph so the spark matches the tag cap height. -->
        <svg class="spark" viewBox="81 10 32 32" aria-hidden="true"><path fill="#10b981" d="M 97 10 C 98.4 18.8 104.2 24.6 113 26 C 104.2 27.4 98.4 33.2 97 42 C 95.6 33.2 89.8 27.4 81 26 C 89.8 24.6 95.6 18.8 97 10 Z"/></svg>
        Chat. Live-edit. Ship the PR.
      </div>
    </div>
  </div>
</body>
</html>

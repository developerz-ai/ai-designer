# Localization source — default locale (en). @wxt-dev/i18n generates the browser
# _locales/ files and the typed `#i18n` module from this file at `wxt prepare` /
# build time. Top-level flat keys back the manifest __MSG_*__ substitutions; nested
# groups back the side-panel UI, accessed via i18n.t('group.key').
#
# Substitutions: named {placeholder} → i18n.t('k', { placeholder: v }); positional
# $1 → i18n.t('k', [v]). Plurals: { 1: 'one', n: '$1 many' } → i18n.t('k', count).
# Data renders (model/tool names, user content, dates, enum values) stay in code —
# they are not translatable copy.

# ─── Manifest (flat top-level keys, referenced as __MSG_<key>__ in wxt.config.ts) ──
extName: developerz.ai Designer
extDescription: Chat with an agent, redesign the live page in real time, then ship the real code via MCP.
actionTitle: developerz.ai Designer

# ─── App shell (App.tsx, index.html) ──────────────────────────────────────────────
app:
  documentTitle: developerz.ai Designer
  # Short form shown in the panel header bar — the document title is too wide at the
  # 360px Chrome pins the side panel to.
  panelTitle: Designer
  logo:
    alt: developerz.ai
  header:
    compose:
      ariaLabel: New chat
    expand:
      ariaLabel: Open in a full window
    more:
      ariaLabel: More options
  # The wordmark disclosure that replaced the tab strip (NavMenu.tsx). The five destination
  # names stay under `tab:` — byte-identical to what the strip carried, because the whole e2e
  # suite locates them by accessible name.
  nav:
    ariaLabel: Sections
  tab:
    chat: Chat
    mcp: MCP
    settings: Settings
    diff:
      ariaLabel: Diff
    history:
      ariaLabel: History

# ─── Pre-Start chat surface (PreStart.tsx) ────────────────────────────────────────
prestart:
  setup:
    title: Set up your provider
    body: Configure a provider above, then hit Start to begin chatting.
    # Deliberately NOT "Settings" / "Open settings": both already name other controls (the tab
    # bar, the onboarding guide's provider step), and an ambiguous accessible name makes every
    # role-based selector in the suite resolve to two elements.
    cta: Set up provider
  ready:
    title: Ready to design
    body: Start a session and tell the agent what to change on this page.
    # Distinct from the header toggle's bare "Start" — two buttons with the same accessible name
    # on one screen is ambiguous for AT and for role-based selectors alike.
    cta: Start designing

# ─── About (AboutSection.tsx) ─────────────────────────────────────────────────────
about:
  section:
    ariaLabel: About
  repoLink: GitHub repository
  issueLink: Report an issue

# ─── First-run onboarding (Onboarding.tsx) ────────────────────────────────────────
onboarding:
  ariaLabel: Get started with Designer
  title: Welcome to Designer
  subtitle: Three quick steps to your first live edit.
  optional: Optional
  skip: Skip for now
  docsLink: Docs
  privacyLink: Privacy policy
  step:
    provider:
      label: Add your AI provider
      desc: Bring your own OpenRouter (or any OpenAI-compatible) key and pick a model.
      cta: Open settings
    mcp:
      label: Connect a backend
      desc: Link an implementation backend so the agent can ship your edits as a real PR.
      cta: Manage backends
    start:
      label: Make your first edit
      desc: Hit Start, then tell the agent what to change on this page.
      cta: Get started


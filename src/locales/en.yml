    start: Start
  panel:
    # Eyebrow over the check list, so the popover names itself instead of opening as
    # an unlabelled stack of rows.
    title: Readiness
  label:
    running: Running…
    ready: Ready
    setupNeeded: Setup needed
  check:
    provider: Provider
    model: Model
    apiKey: API key
    apiKeyNotRequired: not needed (local)
    hostPermission: Host permission
    pageAccess: Page access
    pageAccessDetail: needed for screenshots
    mcp: MCP backend
    mcpDetail: '{connected}/{total} connected'
  fix: Fix
  grant: Grant
  overlay:
    label: On-page overlay
    # Sub-line under the switch label — the row is a control, not a check, so it says
    # what it turns on rather than reporting a status.
    detail: Draw rectangles and narrate steps on the page
    on: 'On'
    off: 'Off'
    reloadNeeded: Saved — reload the page to show the overlay on it.


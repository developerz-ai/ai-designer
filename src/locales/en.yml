# ─── Task timeline (TaskTimeline.tsx) ─────────────────────────────────────────────
task:
  timeline:
    ariaLabel: Ship task status
  counter: '· task {index}/{total}'
  prLink: PR

# ─── Composer (chat/Composer.tsx) ─────────────────────────────────────────────────
# Element focus / picker round-trips (stores/focus.ts)
focus:
  error:
    pageUnreachable: This page didn't respond — reload it and try again.

# The composer's `@` menu (MentionMenu.tsx)
mention:
  ariaLabel: Recently referenced elements

composer:
  modelFallback: Model
  placeholder: Tell the agent what to change…
  input:
    ariaLabel: Message the agent
  model:
    # $1 is the catalogue size. A gateway lists ~300 models; saying how many is what tells the
    # user why there is a search field at all.
    search: Search $1 models…
    noMatch: No model matches that.
  # On screen under the composer AND the textarea's aria-describedby target — Enter-sends is
  # the one surprising thing about this control, so it says so out loud.
  hint:
    keyboard: Press Enter to send, Shift+Enter for a new line
  attach:
    title: Pick an element to attach as context
  send:
    ariaLabel: Send
  stop: Stop

# ─── Context chip (chat/ContextChip.tsx) ──────────────────────────────────────────
contextChip:
  strategy:
    dataAttr: data attr
    id: id
    aria: aria
    text: text
    cssPath: css path
    shadow: shadow
    xpath: XPath
  picking: Picking element…
  # Sits beside the Picking… chip. The picker runs on the PAGE, so the panel has to say
  # where to look and how to get out — neither is discoverable from the panel alone.
  pickingHint: Click an element on the page · Esc to cancel
  stopPicking:
    ariaLabel: Stop picking
  remove:
    ariaLabel: Remove this element
  # Tooltip on the chip's warning glyph. A fragile reference resolves today and may not
  # after the page re-renders — worth saying, not worth a whole row.
  fragile: Fragile selector — may not survive a page change
  # Collapsed stack chip, shown from the 4th reference on.
  count:
    1: $1 element
    n: $1 elements
  clear: Clear
  collapse: Collapse

# ─── Empty state (chat/EmptyState.tsx) ────────────────────────────────────────────
empty:
  title: Tell the agent what to build
  subtitle: 'It edits this page live — pin an element with the picker for context, or start with one of these:'
  # Meta line under the title — mirrors Leo's "Automatic ⓘ". Mode is inferred from the
  # message (src/agent/modes.ts); there is no picker.
  meta: Automatic
  metaHint:
    ariaLabel: Copy, debug or plain chat — picked from what you ask

# ─── Message (chat/Message.tsx) ───────────────────────────────────────────────────
message:
  editsSummary:
    1: $1 edit recorded
    n: $1 edits recorded
  # Shown from send until the first token lands — the gap where a silent panel reads as hung.
  working: Editing the page…

# ─── Suggestion chips (chat/SuggestionChips.tsx) ──────────────────────────────────
suggestion:
  copyHero:
    label: Copy nvidia's hero
    prompt: Copy nvidia.com's hero section onto this page.
  debugFilter:
    label: Debug this filter
    prompt: This filter looks broken — debug and fix it.
  ship:
    label: Ship to developerz.ai
    prompt: Ship my accepted edits to developerz.ai as a PR.

# ─── Thread (chat/Thread.tsx) ─────────────────────────────────────────────────────
thread:
  # Visually-hidden speaker label. Replaces the invalid role="user"/"assistant" that
  # browsers dropped, so a screen reader can still tell the turns apart.
  speaker:
    user: You
    assistant: Agent
  scrollToLatest:
    ariaLabel: Scroll to latest
  newMessages:
    1: $1 new message
    n: $1 new messages

# ─── Tool chip (chat/ToolChip.tsx) ────────────────────────────────────────────────
toolChip:
  kind:
    read: read
    act: act
    info: info
  # Visually-hidden outcome word per call. "pending" is the honest default: the bus
  # reports a tool CALL when the model requests it, so success is only ever asserted
  # once a tool-result actually says so.
  status:
    pending: pending
    running: running
    done: done
    failed: failed

# ─── Tool run group header (chat/ToolCallList.tsx) ────────────────────────────────
# A turn commonly fires 6–12 calls. They collapse behind this header; the running call
# and any failure stay visible even when collapsed, so the interesting rows never hide.
toolRun:
  actions:
    1: $1 action
    n: $1 actions
  failed:
    1: $1 failed
    n: $1 failed

# ─── Message bus (stores/bus.ts) ──────────────────────────────────────────────────
bus:
  error:
    malformedResponse: Malformed service-worker response for "{type}"

# ─── MCP panel (McpPanel.tsx + stores/mcp.ts) ─────────────────────────────────────
mcp:
  hint: Connect an implement backend. The agent ships changesets here.
  loading: Loading servers…
  preset:
    added: '{label} added'
    add: Add {label}
  server:
    toolCount:
      1: $1 tool
      n: $1 tools
    connect: Connect
    authorize: Authorize
    enabled:
      ariaLabel: Enable or disable {label}
      hint: A disabled backend never connects and is skipped by Ship.
    remove:
      ariaLabel: Remove {label}
  writeTools:
    title: Write tools
    hint: Granted tools reach design turns; ungranted stay blocked.
    grant:
      ariaLabel: Allow {tool} in design turns on {label}
  originRepo:
    title: Origin → repo mapping
    empty: No origins mapped yet — Ship downloads a brief instead until one is.
    noActivePage: Open a web page to map its origin to a repo.
    repo:
      label: Repository
      placeholder: owner/name
    backend:
      label: Backend (optional)
      any: Any connected
    branch:
      label: Branch (optional)
      placeholder: main
    save: Save mapping
    remove:
      ariaLabel: Remove mapping for {origin}
    error:
      loadFailed: Failed to load origin mappings.
      saveFailed: Failed to save the mapping.
      removeFailed: Failed to remove the mapping.
  add:
    label: Add server
    labelPlaceholder: Label
    urlPlaceholder: https://backend.example.com/mcp
    authKind:
      none: No auth
      apikey: API key
      oauth: OAuth
    submit: Add
  error:
    listFailed: Failed to list MCP servers.
    addFailed: Failed to add server.
    hostDenied: Host access denied.
    removeFailed: Failed to remove server.
    connectFailed: Failed to connect {id}.
    authFailed: Authorization failed.
    saveFailed: Failed to update the server.


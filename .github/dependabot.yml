# Weekly, with minor and patch updates grouped per ecosystem; a major update arrives on its own.
# The 14-day cooldown lets a compromised release get caught before it reaches us. Security updates
# are unaffected.
version: 2
updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/site"
      - "/waitlist"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    cooldown:
      default-days: 14
    groups:
      bun-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/site"
      - "/waitlist"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    cooldown:
      default-days: 14
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/docs/design/designer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

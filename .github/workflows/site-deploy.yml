name: site-deploy

# Build the Designer landing image and publish it to DOCR.
#
# On push to main touching site/**: build the multi-stage image from
# site/Dockerfile and push `designer-landing` (tags `latest` + `sha-<short>`)
# to registry.digitalocean.com/developerz-ai. ArgoCD Image Updater repins the
# live digest in-cluster — NO SSH / cluster creds here.
#
# Push-trigger ONLY (never pull_request): a PR run would fail at the DOCR push
# (no token pre-provisioning) and block the CI-green merge gate. The Dockerfile
# is validated by the local smoke build in ai-designer#107's acceptance, and
# the workflow YAML is linted by the actionlint job in ci.yml on every PR.
#
# Required secret: DIGITALOCEAN_TOKEN — DigitalOcean API token with registry
# read/write (used as both docker username and password). Human precondition
# under ai-designer#85 / infra #870; this workflow's first live push is gated
# on that secret + the DOCR repo existing.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  # Manual publish: first-time bootstrap (nothing under site/** changed since the
  # DIGITALOCEAN_TOKEN secret landed) and sitekey rebakes (the HCAPTCHA_SITEKEY
  # repo variable changed but no source did).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never auto-cancel an in-flight publish on main.
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: developerz-ai/designer-landing

jobs:
  build-and-push:
    name: Build + push designer-landing
    # GitHub-hosted runner (org rule: private repos on Ubicloud, public on GitHub-hosted).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials: false — nothing after checkout needs git auth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to DOCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Context is site/ so the Dockerfile's `COPY . .` sees the self-contained
      # sub-project; keep this in sync with site/Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          file: site/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # PUBLIC hCaptcha site key (repo variable, not a secret) baked into the
          # Vite bundle. Fails CLOSED: if this repo variable is unset/empty the build
          # aborts (hcaptcha-key-guard in site/vite.config.ts) instead of shipping the
          # always-pass hCaptcha test key. Keep vars.HCAPTCHA_SITEKEY set to the real key.
          build-args: |
            VITE_HCAPTCHA_SITEKEY=${{ vars.HCAPTCHA_SITEKEY }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=designer-landing
          cache-to: type=gha,mode=max,scope=designer-landing

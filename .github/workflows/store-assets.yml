name: Store assets

# Renders the Chrome Web Store screenshots + promo tile (scripts/store-shots.ts) on a Linux
# runner and uploads them as an artifact. Manual-dispatch only: the assets are committed to
# docs/store/assets/ by hand after review, not regenerated on every push. Exists as a workflow
# because the Windows dev box cannot complete Playwright's launch handshake under Bun's
# node-shim (see docs/store/LISTING.md + the e2e note in CLAUDE.md) — CI is where headless
# Chromium actually runs.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  shots:
    name: Render store screenshots
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/bun-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build extension (unpacked build/chrome-mv3)
        run: bun run build
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Render assets
        run: bun run store:shots
      - name: Upload store assets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: store-assets
          path: docs/store/assets/*.png
          if-no-files-found: warn

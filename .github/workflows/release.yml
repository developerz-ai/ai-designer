name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Build + publish release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Production build: tree-shaken + minified JS, minified CSS (WXT/Vite).
      # Also signs build/*.crx. CRX_PRIVATE_KEY (repo secret, PEM contents) keeps the
      # extension ID stable across releases; without it every release signs with a
      # throwaway key and self-hosted installs read as a different extension.
      - name: Build Chrome zip + crx
        run: bun run release
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      - name: Build Firefox zip
        run: bun run build:firefox && bun run zip -- -b firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.zip
            build/*.crx
          generate_release_notes: true
          fail_on_unmatched_files: true

      # --- Chrome Web Store publish (deliberately off until manual QA passes) ----
      # Setup, account by account: docs/STORE-SETUP.md. Needs repo secrets
      #   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
      # `zip:store` rebuilds with CWS_UPLOAD=1, which drops the manifest `key` — the store
      # assigns its own, and an upload carrying ours is rejected.
      # - name: Build store zip
      #   run: bun run zip:store
      # - name: Publish to Chrome Web Store
      #   run: bunx chrome-webstore-upload-cli@3 upload --auto-publish \
      #     --source build/*-chrome.zip \
      #     --extension-id "${{ secrets.CWS_EXTENSION_ID }}" \
      #     --client-id "${{ secrets.CWS_CLIENT_ID }}" \
      #     --client-secret "${{ secrets.CWS_CLIENT_SECRET }}" \
      #     --refresh-token "${{ secrets.CWS_REFRESH_TOKEN }}"

      # --- Firefox AMO publish (blocked on code, not credentials) ---------------
      # The firefox target builds but uses chrome.sidePanel / chrome.debugger, which
      # Firefox does not implement. See docs/STORE-SETUP.md before enabling.
      # - name: Publish to AMO
      #   run: bunx web-ext sign --channel listed --source-dir build/firefox-mv2 \
      #     --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
      #     --api-secret "${{ secrets.AMO_JWT_SECRET }}"

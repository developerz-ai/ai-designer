name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Build + publish release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Production build: tree-shaken + minified JS, minified CSS (WXT/Vite).
      - name: Build Chrome zip
        run: bun run release
      - name: Build Firefox zip
        run: bun run build:firefox && bun run zip -- -b firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .output/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      # --- Chrome Web Store publish (#28) ------------------------------------
      # Secret-guarded by a repo VARIABLE: the step runs only when
      # `CWS_PUBLISH_ENABLED=true` is set (Settings > Secrets and variables >
      # Actions > Variables) AND the four secrets exist. The store item itself is
      # created MANUALLY in the dashboard first — the upload API only updates an
      # existing item.
      - name: Publish to Chrome Web Store
        if: ${{ vars.CWS_PUBLISH_ENABLED == 'true' }}
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: >-
          bunx chrome-webstore-upload-cli@3 upload --auto-publish
          --source .output/*-chrome.zip
          --extension-id "$CWS_EXTENSION_ID"
          --client-id "$CWS_CLIENT_ID"
          --client-secret "$CWS_CLIENT_SECRET"
          --refresh-token "$CWS_REFRESH_TOKEN"

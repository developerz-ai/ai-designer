name: Site

# The landing sub-project is self-contained: its own package.json, its own bun.lock, its own
# toolchain. It lived in ci.yml and so ran on EVERY extension PR — a full install + build for
# files the PR never touched. Path-triggered here instead, which is free: GitHub does the
# filtering, so there is no `detect` job to pay for either.
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  site:
    # The standalone landing sub-project (site/) is self-contained and NOT covered
    # by the jobs above: root `bun run lint` excludes **/site and root typecheck is
    # the extension's tsc. Gate site/ on its own lint/typecheck/build here.
    name: Site (landing)
    # GitHub-hosted runner (org rule: private repos on Ubicloud, public on GitHub-hosted).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # site/ has its own package.json + bun.lock; skip the root install.
          install: 'false'
      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: site
        run: bun run lint
      - name: Typecheck
        working-directory: site
        run: bun run typecheck
      - name: Build
        working-directory: site
        run: bun run build
